<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 – Fundamentos da Web Dinâmica - Andreza Gomes França da Silva</title>
    <meta name="description" content="Essa é uma página de formulário de avaliação de produto.">
    <meta name="author" content="Andreza Gomes">

    <link rel="stylesheet" href="estilos/formulario.css">
    <link rel="stylesheet" href="estilos/formulariomobile.css">

    <script src="scripts/formulario.js" defer></script>
    <script src="scripts/obterdatas.js" defer></script>
    <script src="scripts/nomeproduto.js" defer></script>
    <script src="scripts/localSto.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>


<body>
    <header>
        <h1>Avaliação do Produto</h1>
    </header>
    
    <main>
        <form method="get" action="avaliacao.html" class="avp">

            <fieldset>
                <legend>Nome do Produto:</legend>

             <label for="av">Produto:</label>
                    <select id="av" name="produto" required>
                      <option value="" disabled selected>Selecione um produto ...</option>
                   </select>
            

                
                    <h2>Classificação geral:</h2>
                    <p>Por favor, avalie o produto de 1 a 5 estrelas:</p>
        
                    <div class="stars">
                        <input type="radio" id="estrelacinco" name="stars" value="5" required>
                        <label for="estrelacinco"></label>

                        <input type="radio" id="estrelaquatro" name="stars" value="4" required>
                        <label for="estrelaquatro"></label>

                        <input type="radio" id="estrelatres" name="stars" value="3" required>
                        <label for="estrelatres"></label>

                        <input type="radio" id="estreladois" name="stars" value="2" required>
                        <label for="estreladois"></label>

                        <input type="radio" id="estrelaum" name="stars" value="1" required>
                        <label for="estrelaum"></label>
                    </div>

                    <div class="ref">
                        <a href="https://codepen.io/nevkatz/pen/OJPBBpL" target="_blank">
                            Caneta fonte de classificação por estrelas
                        </a>
                    </div>
            

                <!-- DATA -->
                <label for="calendario" class="data">Data da avaliação:</label>
                <input type="date" id="calendario" name="data" required>

              </fieldset>

            <fieldset>
                <legend>Compartilhe sua experiência:</legend>
              <div class="opcoes">
              <input type="checkbox" id="conforto" name="cf" value="sim">
              <label for="conforto">Conforto</label>

              <input type="checkbox" id="boa" name="qualidade" value="sim">
              <label for="boa">Boa qualidade</label>

              <input type="checkbox" id="bonito" name="estiloso" value="sim">
              <label for="bonito">Bonito/Estiloso</label>

              <input type="checkbox" id="durabilidade" name="dura" value="sim">
              <label for="durabilidade">Durabilidade</label>

              <input type="checkbox" id="cores" name="bonitas" value="sim">
              <label for="cores">Cores/Bonitas</label>
              </div>


               <label for="feedback">
                    <span class="saber">Queremos saber sua opinião:</span>
               </label>

               <textarea id="feedback" name="feedback" rows="4" placeholder="Conte-nos sobre sua experiência com o produto..."></textarea>

               <label for="nome">
                    <span class="nome">Seu nome:</span>
               </label>
                <input type="text" id="nome" name="nome" placeholder="Escreva aqui...">
.
                <button type="submit" class="btn">Submeter avaliação</button>
            </fieldset>

        </form>
    </main>
    
     <footer>
        <p> &copy; <span id="anoatual"></span>🦋Andreza Gomes França da Silva🦋 Paraíba 
        </p>
         <p id="ultimaModificacao"></p>
        
    </footer>
</body>
</html>
