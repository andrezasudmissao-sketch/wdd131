<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="description" content="Preencha">
<meta name="author" content="John Doe">

<!-- Este arquivo inicial foi criado por Paul Cheney -->
<title>Site inicial HTML5 por Paul Cheney</title>

<!-- INFORMA AO CELULAR QUE NÃO DEVE MENTIR SOBRE SUA LARGURA E IMPEDE QUE A FONTE AUMENTE QUANDO O CELULAR É VIRADO DE LADO -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- FOLHAS DE ESTILO -->
<link href="css/normalize.css" rel="stylesheet">
<!-- celular padrão -->
<link href="css/pequeno.css" rel="stylesheet">
<!-- melhoria para tablet -->
<link href="css/medio.css" rel="stylesheet">
<!-- melhoria para desktop -->
<link href="css/grande.css" rel="stylesheet">
     
</head>
<body>
<!-- CABEÇALHO AQUI -->
	<header>
        <h1>Proposta de Curso</h1>
        <h2>Design de Formulários Web</h2>
    </header>
    
    
<!-- NAVEGAÇÃO AQUI -->
    <nav>
        <ul>
            <li><a href="#">Sobre</a></li>
            <li class="ativo"><a href="#">Propor</a></li>
            <li><a href="#">Vencedores</a></li>
            <li><a href="#">Contato</a></li>    
        </ul>
    </nav>
    
    
<!-- CONTEÚDO AQUI -->
<main>
    <h1>Formulário de Proposta de Curso</h1>

    <form method="get" action="obrigado.html" class="fw1"> <!-- O modelo get é usado para enviar informaçao para quem usa git. O action vai ligar esse html ao outro.-->
        <fieldset> <!-- Divide o formulário em blocos-->
            <legend>Informações do candidato </legend> <!--O legend no HTML serve para dar um título ou descrição ao grupo de campos dentro de um <fieldset>. -->
            <Label>Nome:*<input type="text" name="nome" required></Label> <!-- Required é para que pessoa não consiga enviar até preencher esse campo obrigatório.-->
            <Label>Sobrenome:*<input type="text" name="sobrenome" required></Label>
            <Label>telefone:<input type="tel" name="numero" placeholder="83 99876-5467"></Label> <!--Placeholder: mostrar um texto dentro do input antes do usuário digitar algo-->
            <Label>email:*<input type="email" name="email"  placeholder="anamota.doceria@gmail.com" required></Label>
            <Label>Website:<input type="url" name="url" placeholder="http://.."></Label>
        </fieldset>

        <fieldset>
            <legend>Informações do Curso</legend>
            <label><input type="radio" name="publico" value="iniciante">Iniciante</label> <!-- botões de seleção onde o usuário só pode escolher UMA opção entre várias.-->
            <label><input type="radio" name="publico" value="intermediário">Intermediário</label>
            <label><input type="radio" name="publico" value="avancado">Avançado</label>

            <div>Software Necessário</div>
            <label><input type="checkbox" name="edicao" value="sim">Edicão de Fotos</label>
            <label><input type="checkbox" name="programador" value="sim">Programador</label>
            <label><input type="checkbox" name="processador" value="sim">Pré-processador</label>
            <label><input type="checkbox" name="cliente" value="sim">Cliente ETP</label>

        </fieldset>

        <fieldset>
            <legend>Financiamento</legend>
            <label>Data prevista de conclusão<input type="date" name="data"></label> <!--date: abre um espaço com um calendário para colocar data.-->

            <label>Área do Curso
                <select name="tema"> <!--O select: serve para que todas as opções fiquem dentro do mesmo espaço e a pessoa só pode escolher uma opção.-->
                    <option value="">Selecione</option>
                    <option value="software">Desenvolvimento de Software</option> 
                    <option value="criativo">Profissional Criativo</option> 
                    <option value="informacao">Tecnologia da informação</option>
                    <option value="dados">Analista de dados</option>
                    <option value="manufatura">Construção Manufatura</option>
                    <option value="negocios">Negócios</option>
                    <option value="cibernética">Segurança Cibernética</option>
                </select>
            </label>

            <label>Quantidade de autores<input type="number" name="autores"></label>

       
             <input type="submit" value="Propor meu curso">

        </fieldset>


    </form>
</main>
    
<!-- RODAPÉ AQUI -->   
    <footer>
        &copy; 2024 &bull; Paul Cheney &bull; 123-555-6789
    </footer>
<script src="js/scripts.js"></script>
</body>
</html>

<!--method="get" → envia os dados pela URL.

action="obrigado.html" → ao enviar, o navegador vai para obrigado.html.

class="fw1" → aplica estilos definidos no CSS para .fw1.-->
